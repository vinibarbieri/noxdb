<title id="t">WD SN530 4 KiB random write: throughput and p99 vs queue depth</title>
<desc id="d">Throughput rises from 252.6 MB/s at QD1 to 410.0 at QD2 and stays near 421.5 through QD64, while p99 grows from 14.5 us to 1876 us.</desc>
