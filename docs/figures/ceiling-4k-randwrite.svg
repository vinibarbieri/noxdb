<text x="404.0" y="652.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">fio --iodepth (requested queue depth), log₂ spacing</text>
<line x1="68" x2="732" y1="668.0" y2="668.0" stroke="#e6e5e0" stroke-width="1"/>
<text x="68.0" y="684.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Method: fio 3.36, ioengine=libaio, direct=1, rw=randwrite, bs=4k, 16 GiB file on XFS at /mnt/nvme. 5 repetitions</text>
<text x="68.0" y="699.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">× 120 s per point (10 s ramp), drop_caches between points, run after M2 preconditioning (80% of free space</text>
<text x="68.0" y="714.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">written twice with 1 MiB O_DIRECT sequential writes). Run 20260820-032106. Marker = median; whiskers = min–max</text>
<text x="68.0" y="729.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">over repetitions. Most ranges are narrower than the marker, so the spread rows, (max − min) / median, carry the</text>
<text x="68.0" y="744.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">number. p99 is read from fio's bucketed clat histogram, so repetitions often report identical values. Requested</text>
<text x="68.0" y="759.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">iodepth is not the device-observed queue depth: at QD2, iostat reported aqu-sz 1.09 in a later re-measurement</text>
<text x="68.0" y="774.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">(PERFORMANCE.md §3.1).</text>
<text x="68.0" y="795.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">† QD1 comes from run rerun-qd1 (same parameters, shuffled point order). Its repetition 1 was a warm-up transient</text>
<text x="68.0" y="810.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">and is excluded, so n = 4. The main run's QD1 climbed monotonically and was withheld; QD2 re-measured in rerun-</text>
<text x="68.0" y="825.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">qd1 at −0.7% of the value shown. Data: docs/figures/ceiling-4k-randwrite.csv. Table: PERFORMANCE.md §3.1.</text>
